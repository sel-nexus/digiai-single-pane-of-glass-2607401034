services:
  backend:
    build: ./backend
    environment:
      DATABASE_PATH: /data/digiai.db
      SEED_ON_STARTUP: "true"
      CORS_ORIGINS: http://localhost:5173
      BIND_HOST: 0.0.0.0
      BIND_PORT: "8000"
      LOG_LEVEL: INFO
    volumes:
      - prototype-data:/data
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  prototype-data:
